<!doctype html><html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bíladagbókin</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f2ea;color:#171717}.wrap{max-width:760px;margin:auto;padding:24px}.hero{padding:26px 0}.hero h1{font-size:clamp(42px,10vw,78px);line-height:.9;margin:0 0 10px}.cars{display:grid;grid-template-columns:1fr 1fr;gap:14px}.car{border:3px solid #111;border-radius:24px;padding:22px;background:white;box-shadow:7px 7px 0 #111;cursor:pointer}.car.active{background:#ffd95a}.car h2{margin:6px 0}.panel{margin-top:24px;background:#111;color:white;border-radius:24px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input{padding:12px;border-radius:12px;border:0;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:14px;font-weight:900;background:#ff6b6b;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#ffffff12;border-radius:14px;padding:14px}.stat b{display:block;font-size:20px}.list{margin-top:18px}.entry{background:#fff;color:#111;padding:12px 14px;border-radius:12px;margin:8px 0}@media(max-width:560px){.cars,.row,.stats{grid-template-columns:1fr}.hero h1{font-size:52px}}</style></head><body><div class="wrap"><section class="hero"><small>BÍLADAGBÓKIN</small><h1>Hvor bíllinn?</h1><p>Veldu bíl til að skoða eða skrá bensínkostnað.</p></section><div class="cars"><div class="car active" data-car="alex"><small>ALEX</small><h2>Daihatsu Sirion</h2><p>PI264 · Fullt rekstraryfirlit</p></div><div class="car" data-car="kara"><small>KARA</small><h2>Toyota Yaris</h2><p>PAA91 · Bensín sem þú borgar</p></div></div><section class="panel"><h2 id="panelTitle">Alex · Daihatsu Sirion</h2><div class="row"><label class="field">Dagsetning<input id="date" type="date"></label><label class="field">Kostnaður (kr.)<input id="cost" type="number" min="0" inputmode="numeric"></label></div><div class="row"><label class="field">Lítrar<input id="litres" type="number" step="0.01" min="0"></label><label class="field">Km síðan seinast<input id="km" type="number" step="0.1" min="0"></label></div><button class="btn" id="save">VISTA FÆRSLU</button><div class="stats"><div class="stat"><span>Samtals</span><b id="totalCost">0 kr.</b></div><div class="stat"><span>Lítrar</span><b id="totalLitres">0 L</b></div><div class="stat"><span>Meðalverð/L</span><b id="avg">—</b></div></div><div class="list" id="list"></div></section></div><script>let car='alex';const $=x=>document.getElementById(x);const key=()=>`fuel-${car}`;function data(){return JSON.parse(localStorage.getItem(key())||'[]')}function render(){document.querySelectorAll('.car').forEach(c=>c.classList.toggle('active',c.dataset.car===car));$('panelTitle').textContent=car==='alex'?'Alex · Daihatsu Sirion':'Kara · Toyota Yaris';let a=data(),cost=a.reduce((s,x)=>s+Number(x.cost||0),0),lit=a.reduce((s,x)=>s+Number(x.litres||0),0);$('totalCost').textContent=cost.toLocaleString('is-IS')+' kr.';$('totalLitres').textContent=lit.toFixed(1)+' L';$('avg').textContent=lit?Math.round(cost/lit).toLocaleString('is-IS')+' kr.':'—';$('list').innerHTML=a.slice().reverse().map(x=>`<div class="entry"><b>${x.date||'Ódagsett'}</b> · ${Number(x.cost).toLocaleString('is-IS')} kr. · ${x.litres||0} L · ${x.km||0} km</div>`).join('')}document.querySelectorAll('.car').forEach(c=>c.onclick=()=>{car=c.dataset.car;render()});$('save').onclick=()=>{let a=data();a.push({date:$('date').value,cost:$('cost').value,litres:$('litres').value,km:$('km').value});localStorage.setItem(key(),JSON.stringify(a));['cost','litres','km'].forEach(id=>$(id).value='');render()};$('date').value=new Date().toISOString().slice(0,10);render();</script></body></html>
